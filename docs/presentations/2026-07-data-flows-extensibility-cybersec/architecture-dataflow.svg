<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Inter, Arial, sans-serif">
  <!-- Clients -->
  <rect x="120" y="30" width="220" height="70" rx="10" fill="#E8F4EF" stroke="#29685B" stroke-width="2"/>
  <text x="230" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A2420">Policyholder</text>
  <text x="230" y="82" text-anchor="middle" font-size="12" fill="#3D5147">Web / PWA (EL/EN)</text>

  <rect x="420" y="30" width="220" height="70" rx="10" fill="#E8F4EF" stroke="#29685B" stroke-width="2"/>
  <text x="530" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A2420">Agent</text>
  <text x="530" y="82" text-anchor="middle" font-size="12" fill="#3D5147">Portfolio and collaboration</text>

  <rect x="720" y="30" width="220" height="70" rx="10" fill="#E8F4EF" stroke="#29685B" stroke-width="2"/>
  <text x="830" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A2420">Admin</text>
  <text x="830" y="82" text-anchor="middle" font-size="12" fill="#3D5147">Ops, jobs, activity log</text>

  <!-- Edge layer -->
  <rect x="120" y="160" width="820" height="80" rx="10" fill="#29685B" stroke="#1A2420" stroke-width="2"/>
  <text x="530" y="193" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Vercel Edge - proxy.ts middleware</text>
  <text x="530" y="218" text-anchor="middle" font-size="12" fill="#D7EFE4">Rate limit (Upstash Redis) - Supabase session check - RBAC redirects - Security headers / CSP</text>

  <!-- App layer -->
  <rect x="120" y="300" width="250" height="90" rx="10" fill="#F4F6F5" stroke="#5B7268" stroke-width="2"/>
  <text x="245" y="333" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A2420">(public) pages</text>
  <text x="245" y="356" text-anchor="middle" font-size="12" fill="#3D5147">Landing, pricing, guides</text>
  <text x="245" y="374" text-anchor="middle" font-size="12" fill="#3D5147">SEO / JSON-LD</text>

  <rect x="405" y="300" width="250" height="90" rx="10" fill="#F4F6F5" stroke="#5B7268" stroke-width="2"/>
  <text x="530" y="333" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A2420">(protected) pages</text>
  <text x="530" y="356" text-anchor="middle" font-size="12" fill="#3D5147">Layouts re-check auth</text>
  <text x="530" y="374" text-anchor="middle" font-size="12" fill="#3D5147">Admin layout gates role</text>

  <rect x="690" y="300" width="250" height="90" rx="10" fill="#F4F6F5" stroke="#5B7268" stroke-width="2"/>
  <text x="815" y="333" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A2420">/api/v1 - 92 routes</text>
  <text x="815" y="356" text-anchor="middle" font-size="12" fill="#3D5147">requireApiUser + roles</text>
  <text x="815" y="374" text-anchor="middle" font-size="12" fill="#3D5147">Zod validation, versioned</text>

  <!-- Services layer -->
  <rect x="120" y="450" width="250" height="90" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="245" y="483" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A2420">AI Provider Factory</text>
  <text x="245" y="506" text-anchor="middle" font-size="12" fill="#3D5147">Gemini / Anthropic / OpenAI</text>
  <text x="245" y="524" text-anchor="middle" font-size="12" fill="#3D5147">mock for tests - via env keys</text>

  <rect x="405" y="450" width="250" height="90" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="530" y="483" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A2420">Analysis + Gap Engine</text>
  <text x="530" y="506" text-anchor="middle" font-size="12" fill="#3D5147">Extract, translate, score</text>
  <text x="530" y="524" text-anchor="middle" font-size="12" fill="#3D5147">Recommendations</text>

  <rect x="690" y="450" width="250" height="90" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="815" y="483" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A2420">Billing / Compliance</text>
  <text x="815" y="506" text-anchor="middle" font-size="12" fill="#3D5147">Stripe subscriptions</text>
  <text x="815" y="524" text-anchor="middle" font-size="12" fill="#3D5147">GDPR DSR export / delete</text>

  <!-- Data layer -->
  <rect x="120" y="600" width="345" height="90" rx="10" fill="#FFF7E8" stroke="#B7791F" stroke-width="2"/>
  <text x="292" y="633" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A2420">Supabase Postgres</text>
  <text x="292" y="656" text-anchor="middle" font-size="12" fill="#3D5147">Prisma singleton, pooled URLs</text>
  <text x="292" y="674" text-anchor="middle" font-size="12" fill="#3D5147">59 tables, 29 migrations</text>

  <rect x="500" y="600" width="200" height="90" rx="10" fill="#FFF7E8" stroke="#B7791F" stroke-width="2"/>
  <text x="600" y="633" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A2420">Supabase Auth</text>
  <text x="600" y="656" text-anchor="middle" font-size="12" fill="#3D5147">Sessions, magic links</text>
  <text x="600" y="674" text-anchor="middle" font-size="12" fill="#3D5147">Email verification</text>

  <rect x="735" y="600" width="205" height="90" rx="10" fill="#FFF7E8" stroke="#B7791F" stroke-width="2"/>
  <text x="837" y="633" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A2420">Upstash Redis</text>
  <text x="837" y="656" text-anchor="middle" font-size="12" fill="#3D5147">Rate-limit counters</text>
  <text x="837" y="674" text-anchor="middle" font-size="12" fill="#3D5147">No PII stored</text>

  <!-- External services column -->
  <rect x="1000" y="160" width="230" height="70" rx="10" fill="#FDECEC" stroke="#B23B3B" stroke-width="2"/>
  <text x="1115" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A2420">Stripe</text>
  <text x="1115" y="212" text-anchor="middle" font-size="11" fill="#3D5147">Checkout + signed webhooks</text>

  <rect x="1000" y="250" width="230" height="70" rx="10" fill="#FDECEC" stroke="#B23B3B" stroke-width="2"/>
  <text x="1115" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A2420">Brevo</text>
  <text x="1115" y="302" text-anchor="middle" font-size="11" fill="#3D5147">Transactional email (EL)</text>

  <rect x="1000" y="340" width="230" height="70" rx="10" fill="#FDECEC" stroke="#B23B3B" stroke-width="2"/>
  <text x="1115" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A2420">Sentry</text>
  <text x="1115" y="392" text-anchor="middle" font-size="11" fill="#3D5147">Errors + monitoring tunnel</text>

  <rect x="1000" y="430" width="230" height="70" rx="10" fill="#FDECEC" stroke="#B23B3B" stroke-width="2"/>
  <text x="1115" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A2420">AI APIs</text>
  <text x="1115" y="482" text-anchor="middle" font-size="11" fill="#3D5147">Gemini / Claude / GPT</text>

  <rect x="1000" y="520" width="230" height="70" rx="10" fill="#FDECEC" stroke="#B23B3B" stroke-width="2"/>
  <text x="1115" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A2420">QStash (planned)</text>
  <text x="1115" y="572" text-anchor="middle" font-size="11" fill="#3D5147">Async analysis queue</text>

  <!-- Arrows: clients -> edge -->
  <line x1="230" y1="100" x2="230" y2="160" stroke="#29685B" stroke-width="2"/>
  <polygon points="230,160 225,150 235,150" fill="#29685B"/>
  <line x1="530" y1="100" x2="530" y2="160" stroke="#29685B" stroke-width="2"/>
  <polygon points="530,160 525,150 535,150" fill="#29685B"/>
  <line x1="830" y1="100" x2="830" y2="160" stroke="#29685B" stroke-width="2"/>
  <polygon points="830,160 825,150 835,150" fill="#29685B"/>

  <!-- Edge -> app -->
  <line x1="245" y1="240" x2="245" y2="300" stroke="#5B7268" stroke-width="2"/>
  <polygon points="245,300 240,290 250,290" fill="#5B7268"/>
  <line x1="530" y1="240" x2="530" y2="300" stroke="#5B7268" stroke-width="2"/>
  <polygon points="530,300 525,290 535,290" fill="#5B7268"/>
  <line x1="815" y1="240" x2="815" y2="300" stroke="#5B7268" stroke-width="2"/>
  <polygon points="815,300 810,290 820,290" fill="#5B7268"/>

  <!-- App -> services -->
  <line x1="530" y1="390" x2="530" y2="450" stroke="#4F46E5" stroke-width="2"/>
  <polygon points="530,450 525,440 535,440" fill="#4F46E5"/>
  <line x1="815" y1="390" x2="815" y2="450" stroke="#4F46E5" stroke-width="2"/>
  <polygon points="815,450 810,440 820,440" fill="#4F46E5"/>
  <line x1="245" y1="390" x2="245" y2="450" stroke="#4F46E5" stroke-width="2"/>
  <polygon points="245,450 240,440 250,440" fill="#4F46E5"/>

  <!-- Services -> data -->
  <line x1="292" y1="540" x2="292" y2="600" stroke="#B7791F" stroke-width="2"/>
  <polygon points="292,600 287,590 297,590" fill="#B7791F"/>
  <line x1="600" y1="540" x2="600" y2="600" stroke="#B7791F" stroke-width="2"/>
  <polygon points="600,600 595,590 605,590" fill="#B7791F"/>
  <line x1="837" y1="540" x2="837" y2="600" stroke="#B7791F" stroke-width="2"/>
  <polygon points="837,600 832,590 842,590" fill="#B7791F"/>

  <!-- Externals connections -->
  <line x1="940" y1="200" x2="1000" y2="195" stroke="#B23B3B" stroke-width="2"/>
  <polygon points="1000,195 990,191 990,201" fill="#B23B3B"/>
  <line x1="940" y1="490" x2="1000" y2="465" stroke="#B23B3B" stroke-width="2"/>
  <polygon points="1000,465 990,463 992,473" fill="#B23B3B"/>

  <!-- Legend -->
  <text x="120" y="740" font-size="13" font-weight="bold" fill="#1A2420">Data flow: Client -&gt; Edge guard -&gt; App (auth re-check) -&gt; Services -&gt; Data stores. External calls leave only via server-side services.</text>
  <text x="120" y="765" font-size="12" fill="#3D5147">Defense in depth: every layer re-validates identity and ownership. PDFs and PII never reach third parties except the selected AI provider during analysis.</text>
</svg>
