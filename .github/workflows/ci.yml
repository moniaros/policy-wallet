name: CI

on:
  push:
    branches: [main, develop, NEW-UI]
  pull_request:
    branches: [main, develop, NEW-UI]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    # Hoisted so the gap-catalogue step can test for their presence. `secrets`
    # is not a permitted context in a step-level `if` — using it there does not
    # skip the step, it fails the whole workflow to compile.
    env:
      # The catalogue check needs a database. These are the same secrets the
      # build job already uses; it previously looked for DEV_DATABASE_URL /
      # DEV_DIRECT_URL, which have never existed — so the step SKIPPED on every
      # run since it was written, and a skipped step is indistinguishable from a
      # passing one. Wired to the real names 2026-08-25.
      CATALOGUE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CATALOGUE_DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API auth guard audit
        run: npm run audit:api-auth
        continue-on-error: false

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Run changed-files i18n hardcoded-text check
        run: npm run lint:i18n-changed
        continue-on-error: false

      - name: Run UTF-8 source validation
        run: npm run lint:utf8
        continue-on-error: false

      - name: Run TypeScript type check
        run: npm run type-check
        continue-on-error: false

      # Reference data must not drift from the repo. The repo-side half of this
      # (the authored catalogue is all rule-bearing, all active, no AI-minted
      # entries) is a unit test and always runs. THIS step is the other half:
      # it asks a real database whether its ACTIVE gap rules are the ones the
      # repo authored. It needs a database, and CI holds no database secret
      # today, so it is skipped until DEV_DATABASE_URL exists — at which point
      # it starts failing on drift with no further change here.
      #
      # Drift in this table changes what the product detects, with no diff and
      # no review. It has now happened three times: migrations, plan rows, and
      # gap definitions.
      - name: Verify gap catalogue matches the database
        if: env.CATALOGUE_DATABASE_URL != ''
        # Print the HOST only — no user, no password, no query string. Which
        # database CI checks decides what a red here means: dev drift is a local
        # repair, prod drift is customer-facing and blocks the deploy on purpose.
        # Nobody could answer that from outside the secret store, so the run says.
        run: |
          node -e "const u=new URL(process.env.DATABASE_URL);console.log('catalogue check target host:',u.hostname,'db:',u.pathname.slice(1))"
          npm run verify:gap-catalogue
        env:
          DATABASE_URL: ${{ env.CATALOGUE_DATABASE_URL }}
          DIRECT_URL: ${{ env.CATALOGUE_DIRECT_URL || env.CATALOGUE_DATABASE_URL }}
        continue-on-error: false

      # A skipped gate looks exactly like a passing one. If the secret ever goes
      # missing again, say so loudly in the run summary rather than going quiet
      # for another two months.
      - name: Say so when the catalogue check could not run
        if: env.CATALOGUE_DATABASE_URL == ''
        run: |
          echo "::warning title=Gap catalogue unverified::No database secret, so the ACTIVE gap catalogue was NOT compared against the repo. Drift in this table changes what the product detects, with no diff and no review."
          {
            echo "### ⚠️ Gap catalogue NOT verified"
            echo ""
            echo "\`verify:gap-catalogue\` was skipped: no database secret is available to this workflow."
            echo "The authored-catalogue unit test still ran; the database comparison did not."
            echo ""
            echo "This check has caught real drift — the AI clarity pipeline mints rules at runtime."
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest --run tests/unit
        continue-on-error: false

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          # Provide dummy values for build-time env vars
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://placeholder' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-placeholder-secret' }}
          # A build artifact doesn't rate-limit — allow it without Upstash creds.
          RATELIMIT_ALLOW_LOCAL: '1'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated
        continue-on-error: true
