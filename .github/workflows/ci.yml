name: CI

on:
  push:
    branches: [main, develop, NEW-UI]
    # A docs-only commit cannot break a build, and this workflow costs ~17
    # billable minutes across its five jobs. The status/queue/audit files change
    # several times a day and were paying full price to lint code that had not
    # moved. `paths-ignore` is evaluated per push, so a commit that touches BOTH
    # docs and code still runs — it only skips when nothing outside these paths
    # changed, which is the safe direction to be wrong in.
    paths-ignore:
      - 'docs/**'
      - '.archive/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [main, develop, NEW-UI]
    paths-ignore:
      - 'docs/**'
      - '.archive/**'
      - '**/*.md'
      - 'LICENSE'

# Only the newest commit on a ref is worth testing. Without this, a run started
# for a commit that was superseded thirty seconds later still occupied a runner
# for its full ~17 minutes: 70 commits landed on NEW-UI in three days and the
# account's Actions minutes ran out mid-month with most of them already
# obsolete by the time their CI finished.
#
# `main` is deliberately EXEMPT. Cancelling a run on the production branch would
# leave a merged commit with no verdict at all, and deploy.yml triggers on
# `workflow_run: CI completed` — a cancelled CI is a silent non-deploy, which is
# exactly the class of failure the deploy gate exists to prevent. Feature
# branches can afford to lose a stale answer; the branch that ships cannot.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    # Hoisted so the gap-catalogue step can test for their presence. `secrets`
    # is not a permitted context in a step-level `if` — using it there does not
    # skip the step, it fails the whole workflow to compile.
    env:
      # The catalogue check needs a database. These are the same secrets the
      # build job already uses; it previously looked for DEV_DATABASE_URL /
      # DEV_DIRECT_URL, which have never existed — so the step SKIPPED on every
      # run since it was written, and a skipped step is indistinguishable from a
      # passing one. Wired to the real names 2026-08-25.
      CATALOGUE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CATALOGUE_DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API auth guard audit
        run: npm run audit:api-auth
        continue-on-error: false

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Run changed-files i18n hardcoded-text check
        run: npm run lint:i18n-changed
        continue-on-error: false

      - name: Run UTF-8 source validation
        run: npm run lint:utf8
        continue-on-error: false

      - name: Run TypeScript type check
        run: npm run type-check
        continue-on-error: false

      # Reference data must not drift from the repo. The repo-side half of this
      # (the authored catalogue is all rule-bearing, all active, no AI-minted
      # entries) is a unit test and always runs. THIS step is the other half:
      # it asks a real database whether its ACTIVE gap rules are the ones the
      # repo authored. It needs a database, and CI holds no database secret
      # today, so it is skipped until DEV_DATABASE_URL exists — at which point
      # it starts failing on drift with no further change here.
      #
      # Drift in this table changes what the product detects, with no diff and
      # no review. It has now happened three times: migrations, plan rows, and
      # gap definitions.
      - name: Verify gap catalogue matches the database
        if: env.CATALOGUE_DATABASE_URL != ''
        # Print the HOST only — no user, no password, no query string. Which
        # database CI checks decides what a red here means: dev drift is a local
        # repair, prod drift is customer-facing and blocks the deploy on purpose.
        # Nobody could answer that from outside the secret store, so the run says.
        run: |
          node -e "const u=new URL(process.env.DATABASE_URL);console.log('catalogue check target host:',u.hostname,'db:',u.pathname.slice(1))"
          npm run verify:gap-catalogue
        env:
          DATABASE_URL: ${{ env.CATALOGUE_DATABASE_URL }}
          DIRECT_URL: ${{ env.CATALOGUE_DIRECT_URL || env.CATALOGUE_DATABASE_URL }}
        continue-on-error: false

      # A skipped gate looks exactly like a passing one. If the secret ever goes
      # missing again, say so loudly in the run summary rather than going quiet
      # for another two months.
      - name: Say so when the catalogue check could not run
        if: env.CATALOGUE_DATABASE_URL == ''
        run: |
          echo "::warning title=Gap catalogue unverified::No database secret, so the ACTIVE gap catalogue was NOT compared against the repo. Drift in this table changes what the product detects, with no diff and no review."
          {
            echo "### ⚠️ Gap catalogue NOT verified"
            echo ""
            echo "\`verify:gap-catalogue\` was skipped: no database secret is available to this workflow."
            echo "The authored-catalogue unit test still ran; the database comparison did not."
            echo ""
            echo "This check has caught real drift — the AI clarity pipeline mints rules at runtime."
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest --run tests/unit
        continue-on-error: false

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          # `next build` type-checks in-process. The runner's default old-space
          # (~2 GB) was already at the edge of this project's type graph and
          # OOMed on PR #322 (`Ineffective mark-compacts near heap limit`);
          # the type-check script carries the same ceiling in package.json.
          NODE_OPTIONS: --max-old-space-size=4096
          # Provide dummy values for build-time env vars
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://placeholder' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-placeholder-secret' }}
          # A build artifact doesn't rate-limit — allow it without Upstash creds.
          RATELIMIT_ALLOW_LOCAL: '1'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next
          retention-days: 7

  # THE JOURNEY CHECK. The gate above checks CODE; this checks the PRODUCT.
  #
  # money-path.spec.ts is the only automated check of the paid conversion
  # journey, and it had been red for five days before anyone noticed — because
  # Playwright is not in this workflow. When it was finally run it was not one
  # stale selector: 6 of 14 failed, 4 never ran, and the spec could not pass in
  # ANY configuration. It also surfaced a live pricing defect (one word naming
  # two plans at two prices) that every green gate had missed.
  #
  # It needs a database — global-setup provisions the E2E users and the fixture
  # policy over SQL, and REFUSES to run against production (global-setup.ts).
  # CI holds no database secret today, so this is skipped until E2E_DATABASE_URL
  # exists, at which point it starts running with no further change here.
  money-path-journey:
    name: Money Path (E2E journey)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    env:
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.E2E_DATABASE_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: env.E2E_DATABASE_URL != ''
        run: npm ci

      - name: Install Playwright chromium
        if: env.E2E_DATABASE_URL != ''
        run: npx playwright install --with-deps chromium

      # Print the HOST only — never the credential. Which database this runs
      # against decides what a red here means, and global-setup refuses prod.
      - name: Run the paid conversion journey
        if: env.E2E_DATABASE_URL != ''
        run: |
          node -e "const u=new URL(process.env.DATABASE_URL);console.log('journey target host:',u.hostname,'db:',u.pathname.slice(1))"
          npx playwright test --project=money-free
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.E2E_DIRECT_URL || env.E2E_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-placeholder-secret' }}
          RATELIMIT_ALLOW_LOCAL: '1'
        continue-on-error: false

      - name: Upload the failure trace
        if: failure() && env.E2E_DATABASE_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: money-path-traces
          path: test-results
          retention-days: 7

      # A skipped gate looks exactly like a passing one — the lesson this repo
      # has now learned twice. Say plainly WHICH journey is unverified.
      - name: Say so when the journey could not run
        if: env.E2E_DATABASE_URL == ''
        run: |
          echo "::warning title=Paid conversion journey unverified::No E2E database secret, so money-path.spec.ts did NOT run. The gate checks code; this is the only thing that checks the purchase journey."
          {
            echo "### ⚠️ Money path NOT verified"
            echo ""
            echo "\`money-path.spec.ts\` was skipped: no \`E2E_DATABASE_URL\` secret is available."
            echo ""
            echo "This is the only automated check of the PAID CONVERSION journey."
            echo "It was red for five days undetected, and when finally run it found"
            echo "6 failures plus a live pricing defect that every green gate had missed."
          } >> "$GITHUB_STEP_SUMMARY"


  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated
        continue-on-error: true
