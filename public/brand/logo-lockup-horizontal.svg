<svg width="196" height="32" viewBox="0 0 196 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PolicyWallet">
  <!-- Mark + wordmark, 9px gap. "Policy" fg-primary, "Wallet" fg-brand.
       Wordmark uses the display stack; environments without the font fall back
       per the stack. Clear space = the mark's corner radius on all sides. -->
  <g transform="scale(1.3333)" fill="var(--fg-primary, #10312B)">
    <path fill-rule="evenodd" d="
    M6 2.5 h12 A3.5 3.5 0 0 1 21.5 6 v12 a3.5 3.5 0 0 1 -3.5 3.5 H6
    A3.5 3.5 0 0 1 2.5 18 V6 A3.5 3.5 0 0 1 6 2.5 Z
    M21.5 9 H15 a3 3 0 0 0 0 6 h6.5 Z" />
  
    <circle cx="16.4" cy="12" r="2" fill="var(--fg-brand, #3E8C79)"/>
  </g>
  <text x="41" y="22.5" font-family="Commissioner, Inter, -apple-system, system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="-0.3">
    <tspan fill="var(--fg-primary, #10312B)">Policy</tspan><tspan fill="var(--fg-brand, #29685B)">Wallet</tspan>
  </text>
</svg>
